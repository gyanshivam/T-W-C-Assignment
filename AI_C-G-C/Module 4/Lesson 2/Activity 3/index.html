<!DOCTYPE html>
<html lang="en">

<head>
 <meta charset="UTF-8" />
 <meta name="viewport" content="width=device-width, initial-scale=1.0" />
 <title>Expression Function</title>
</head>

<body>
 <h1>Javascript Expression Functions</h1>
 <h3>Here we learn about expression function</h3>

  <p>Result of the calculation is shown below:</p>


  <script>
   let calculateSum = function (num1, num2) {
    return num1 + num2;
   };

   document.write("Sum = " + calculateSum(18, 12));
  </script>

</body>

</html>
