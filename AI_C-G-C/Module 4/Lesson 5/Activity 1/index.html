<!DOCTYPE html>
<html lang="en">

<head>
 <meta charset="UTF-8" />
 <meta name="viewport" content="width=device-width, initial-scale=1.0" />
 <title>Arrays in JS</title>
</head>

<body>

 <h2>JavaScript Array Example</h2>

 <p>The third subject in the array is:</p>

 <p id="result"></p>

 <script>
  let subjects = [
   "Mathematics",
   "Science",
   "Computer"
  ];

  document.getElementById("result").innerHTML = subjects[2];
 </script>

</body>

</html>

</html>
