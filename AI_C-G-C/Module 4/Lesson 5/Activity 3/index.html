<!DOCTYPE html>
<html lang="en">

<head>
 <meta charset="UTF-8" />
 <meta name="viewport" content="width=device-width, initial-scale=1.0" />
 <title>JS Call Stack</title>
</head>

<body>

 <h2>JavaScript Call Stack Example</h2>

 <p>This example shows how one function calls another function.</p>

 <p id="output"></p>

 <script>

  function multiply(num1, num2) {
   return num1 * num2;
  }

  function squareArea(length, width) {
   return multiply(length, width);
  }

  let area = squareArea(8, 5);

  document.getElementById("output").innerHTML =
   "Area = " + area;

 </script>

</body>

</html>
