<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Zoo</title>

    <style>
      body {
        font-family: Verdana, sans-serif;
        background-color: #f4f9ff;
        text-align: center;
        padding: 30px;
      }

      h1 {
        color: #0d6efd;
      }

      #park {
        width: 320px;
        margin: auto;
        padding: 15px;
        border: 2px solid #0d6efd;
        border-radius: 10px;
        background-color: white;
      }

      .section {
        border: 1px solid #0d6efd;
        border-radius: 5px;
        margin: 8px 0;
        padding: 10px;
        text-align: left;
      }

      button {
        background-color: #0d6efd;
        color: white;
        border: none;
        padding: 10px 22px;
        border-radius: 20px;
        cursor: pointer;
      }
    </style>
  </head>

  <body>
    <h1>Animal Park</h1>

    <p>Click the button to display the animals in each section.</p>

    <div id="park">
      <div class="section">Section A: <span id="animal1"></span></div>

      <div class="section">Section B: <span id="animal2"></span></div>

      <div class="section">Section C: <span id="animal3"></span></div>

      <div class="section">Number of Animals: <span id="count"></span></div>
    </div>

    <br />

    <button onclick="showAnimals()">Visit the Park</button>

    <p id="status"></p>

    <script>
      function showAnimals() {
        // Display animals
        document.getElementById('animal1').innerHTML = 'Tiger'
        document.getElementById('animal2').innerHTML = 'Giraffe'
        document.getElementById('animal3').innerHTML = 'Zebra'

        // Display total
        document.getElementById('count').innerHTML = '3'

        // Change background color
        document.getElementById('park').style.backgroundColor = '#d4edda'

        // Show page title using document object
        document.getElementById('status').innerHTML =
          'Welcome to ' + document.title + '!'
      }
    </script>
  </body>
</html>
