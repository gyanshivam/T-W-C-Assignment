<!DOCTYPE html>
<html lang="en">

<head>
 <meta charset="UTF-8" />
 <meta name="viewport" content="width=device-width, initial-scale=1.0" />
 <title>Operators</title>
</head>

<body>
 <h1>Javascript Operators</h1>
 <h3>Operators in JS are much similar to other languages except from few</h3>
 <p id="op"></p>

 <script>
  
  let x = 40;
  let y = 3;

  let output = x ** y;//an operator in JS

  //putting paragraph using JS
  document.getElementById("op").innerHTML = "This is the final output: " + output + ".";
 </script>
</body>

</html>
