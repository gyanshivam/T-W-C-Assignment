<!DOCTYPE html>
<html lang="en">

<head>
 <meta charset="UTF-8" />
 <meta name="viewport" content="width=device-width, initial-scale=1.0" />
 <title>Statement</title>
</head>

<body>
 <h1>Javascript Statement</h1>
 <h3>Statements of Javascript are different lines of code written in JS to execute in web page</h3>
 <p id="sum"></p>

 <script>
  
  let x = 40;//statement 1
  let y = 20;//statement 2

  let output = x + y;//statement 3

  //putting paragraph using JS (statement 4)
  document.getElementById("sum").innerHTML = "This is the final output: " + output+ ".";
 </script>
</body>

</html>
