<!DOCTYPE html>
<html lang="en">

<head>
 <meta charset="UTF-8" />
 <meta name="viewport" content="width=device-width, initial-scale=1.0" />
 <title>Variables</title>
</head>

<body>
 <h1>Adding two variables</h1>
 <p>Total Sum will  be the addition of both the variables</p>
 <p id="sum"></p>

 <script>
  
  let x = 9;
  let y = 20;

  let output = x+y;

  //putting paragraph using JS
  document.getElementById("sum").innerHTML = "The final sum of " + x + " values " + y + " = " + output;
 </script>
</body>

</html>
