<!DOCTYPE html>
<html lang="en">

<head>
 <meta charset="UTF-8" />
 <meta name="viewport" content="width=device-width, initial-scale=1.0" />
 <title>String Function</title>
</head>

<body>
 <h2>JavaScript String Functions</h2>
 <p>Examples of some built-in string methods</p>
 
 <script>
  let text = "HeLLo WoRLd";

  document.write(text.toUpperCase());
  document.write("<br>");

  document.write(text.toLowerCase());
  document.write("<br>");

  document.write(text.startsWith("H"));
  document.write("<br>");

  // Test Method -> returns true or false
  let sentence = "JavaScript makes coding easier";
  let pattern = /coding/;
  let output = pattern.test(sentence);

  document.write(output);
 </script>

</body>

</html>
