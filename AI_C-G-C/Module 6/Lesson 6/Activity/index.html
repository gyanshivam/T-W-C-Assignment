<!DOCTYPE html>
<html lang="en">

<head>

 <!-- Defines the character encoding used by the webpage -->
 <meta charset="UTF-8">

 <!-- Makes the calculator responsive on different screen sizes -->
 <meta name="viewport" content="width=device-width, initial-scale=1.0">

 <!-- Connects our external CSS file -->
 <link rel="stylesheet" href="style.css">

 <!-- Imports the Open Sans font from Google Fonts -->
 <link href="https://fonts.googleapis.com/css?family=Open+Sans:600,700" rel="stylesheet">

 <title>My Calculator</title>

</head>

<body>

 <!--
        Main container of the webpage.

        This element acts as the outer area around our calculator.
        The background image and overall page positioning are
        controlled through CSS.
    -->
 <div id="container">

  <!--
            This is the actual calculator box.

            It contains two main parts:
            1. Result area
            2. Keyboard area
        -->
  <div id="calculator">

   <!--
                Result section.

                This area displays:
                - Previous calculation / history
                - Current number / answer
            -->
   <div id="result">

    <!--
                    History shows the calculation being created.

                    Example:
                    25 + 10
                -->
    <div id="history">
     <p id="history-value"></p>
    </div>

    <!--
                    Output shows the number currently entered
                    or the final result.
                -->
    <div id="output">
     <p id="output-value"></p>
    </div>

   </div>

   <!--
                Keyboard section.

                All calculator buttons are placed inside this
                container.
            -->
   <div id="keyboard">

    <!-- Clear removes the complete calculation -->
    <button class="operator" id="clear">C</button>

    <!-- CE removes the last entered digit -->
    <button class="operator" id="backspace">CE</button>

    <!-- Percentage operator -->
    <button class="operator" id="%">%</button>

    <!-- Division operator -->
    <button class="operator" id="/">/</button>


    <!-- Number buttons -->
    <button class="number" id="7">7</button>
    <button class="number" id="8">8</button>
    <button class="number" id="9">9</button>

    <!-- Multiplication operator -->
    <button class="operator" id="*">*</button>


    <button class="number" id="4">4</button>
    <button class="number" id="5">5</button>
    <button class="number" id="6">6</button>

    <!-- Subtraction operator -->
    <button class="operator" id="-">-</button>


    <button class="number" id="1">1</button>
    <button class="number" id="2">2</button>
    <button class="number" id="3">3</button>

    <!-- Addition operator -->
    <button class="operator" id="+">+</button>


    <!--
                    Empty buttons are used only to keep the
                    calculator layout aligned.
                -->
    <button class="empty"></button>

    <button class="number" id="0">0</button>

    <!-- Empty space -->
    <button class="empty"></button>

    <!-- Equal button calculates the answer -->
    <button class="operator" id="=">=</button>

   </div>

  </div>

 </div>


 <!--
        JavaScript file.

        The HTML is loaded first and then JavaScript is loaded,
        so JavaScript can find and work with the calculator
        elements.
    -->
 <script src="script.js"></script>

</body>

</html>
