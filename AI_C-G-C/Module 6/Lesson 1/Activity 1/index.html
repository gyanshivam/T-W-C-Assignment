<!DOCTYPE html>
<html lang="en">

<head>
 <meta charset="UTF-8">

 <!-- Makes the webpage responsive on different screen sizes -->
 <meta name="viewport" content="width=device-width, initial-scale=1.0">

 <!-- Bootstrap gives us ready-made layout and utility classes -->
 <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.4.1/css/bootstrap.min.css">

 <!-- Our own CSS file for custom styling -->
 <link rel="stylesheet" href="style.css">

 <!-- Font Awesome provides icons -->
 <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">

 <!-- Google Font used for the text on the page -->
 <link href="https://fonts.googleapis.com/css2?family=Baloo+Tamma+2:wght@400;500;600;700&display=swap" rel="stylesheet">

 <title>My Navigation Bar</title>
</head>

<body>

 <!-- Main navigation bar -->
 <nav class="navbar-area">

  <!-- Left side: website logo and name -->
  <div class="brand-section">

   <!-- Font Awesome code icon -->
   <i class="fas fa-laptop-code"></i>

   <!-- Website name -->
   <span>MY PORTFOLIO</span>

  </div>


  <!-- Right side: navigation links -->
  <div class="menu-section">

   <!-- Each link can point to a section of the webpage -->
   <a href="#home">Home</a>

   <a href="#about">About</a>

   <a href="#work">My Work</a>

   <a href="#contact">Contact</a>

  </div>

 </nav>


 <!-- Small content area to demonstrate the navigation bar -->
 <div id="home" class="container text-center mt-5">

  <h1>Welcome to My Portfolio</h1>

  <p>
   Use the navigation bar above to explore the website.
  </p>

 </div>

</body>

</html>
