<!DOCTYPE html>
<html lang="en">

<head>

 <!-- Defines the character encoding -->
 <meta charset="UTF-8">

 <!-- Makes the webpage responsive on different devices -->
 <meta name="viewport" content="width=device-width, initial-scale=1.0">

 <!-- Bootstrap CSS -->
 <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.4.1/css/bootstrap.min.css">

 <!-- Our custom CSS -->
 <link rel="stylesheet" href="style.css">

 <!-- Google Fonts -->
 <link href="https://fonts.googleapis.com/css2?family=Baloo+Tamma+2:wght@400;500;600;700&display=swap" rel="stylesheet">

 <title>My Banner</title>

</head>

<body>

 <!--
        Banner section

        The "hero-banner" class will be styled in CSS
        to display a large background image.
    -->
 <section class="hero-banner">

  <!--
            This container keeps the content organized
            and uses Bootstrap's container class.
        -->
  <div class="container banner-content">

   <h1 class="display-4">Welcome to My Website</h1>

   <p class="lead">
    Explore, Learn and Create
   </p>

   <!-- Bootstrap button -->
   <button class="btn btn-warning">
    Explore Now
   </button>

  </div>

 </section>

</body>

</html>
