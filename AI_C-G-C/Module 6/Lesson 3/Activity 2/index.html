<!DOCTYPE html>
<html lang="en">

<head>
 <!-- Defines the character encoding used by the webpage -->
 <meta charset="UTF-8">

 <!-- Makes the page responsive on different screen sizes -->
 <meta name="viewport" content="width=device-width, initial-scale=1.0">

 <!-- Bootstrap CSS:
         Bootstrap provides ready-made classes for spacing,
         text alignment, colors, and responsive layouts. -->
 <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.4.1/css/bootstrap.min.css">

 <!-- Our own CSS file for custom styling -->
 <link rel="stylesheet" href="style.css">

 <!-- Font Awesome:
         Provides icons that can be used in the webpage. -->
 <script src="https://kit.fontawesome.com/996973c893.js"></script>

 <!-- Google Fonts:
         Loads the Roboto Slab font from Google Fonts. -->
 <link href="https://fonts.googleapis.com/css2?family=Roboto+Slab:wght@400;500;700&display=swap" rel="stylesheet">

 <!-- Text displayed in the browser tab -->
 <title>My Portfolio</title>
</head>

<body>

 <!-- Footer section:
         The footer normally contains information that appears
         at the bottom of a webpage, such as copyright details. -->
 <footer class="page-footer">

  <!-- Bootstrap container keeps the content neatly aligned
             and prevents it from touching the edges of the screen. -->
  <div class="container text-center py-4">

   <!-- Small Font Awesome code icon -->
   <i class="fas fa-code footer-icon mb-2"></i>

   <!-- Main footer message -->
   <h5 class="footer-title">
    My Web Portfolio
   </h5>

   <!-- Copyright symbol:
                 &copy; is an HTML entity that displays ©. -->
   <p class="mb-1">
    &copy; 2026 My Portfolio. All rights reserved.
   </p>

   <!-- Link that takes the user back to the top/about section -->
   <a href="#about" class="footer-link">
    Back to About
   </a>

  </div>

 </footer>

</body>

</html>
